<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Register your business · ShinePro</title><link rel="stylesheet" href="business.css"/></head><body><header><a class="brand" href="landing.html"><span>✦</span> SHINE<span>PRO</span></a><a href="landing.html">← Back to public site</a></header><main><p class="eyebrow">BUSINESS ONBOARDING</p><h1>Bring your car wash<br/><em>into focus.</em></h1><p class="intro">Your request is reviewed by the platform team. It never creates unrestricted Owner access automatically.</p><form id="business-form"><div class="form-grid"><label>Business name<input name="businessName" required placeholder="Your car-wash business"/></label><label>Contact person<input name="contactName" required placeholder="Full name"/></label><label>Phone<input name="phone" required placeholder="09•• ••• ••••"/></label><label>Email<input name="email" type="email" required placeholder="you@example.com"/></label><label>City<input name="city" required placeholder="Tehran"/></label><label>Number of branches<input name="branchCount" type="number" min="1" value="1" required/></label><label class="wide">Short business description<textarea name="description" rows="5" placeholder="Tell us what you are building."></textarea></label></div><div class="form-actions"><a href="landing.html">Cancel</a><button type="submit">Submit review request ↗</button></div><p id="feedback" role="status"></p></form></main><script src="business-registration.js" defer></script></body></html>
